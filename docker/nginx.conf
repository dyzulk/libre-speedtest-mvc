server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    
    root /var/www/html/public;
    index index.html index.php;
    client_max_body_size 100m;

    # CORS Headers helper
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Cache-Control, Content-Encoding" always;

    # Prevent caching of configuration files
    location ~* /(config\.json|settings\.json|server-list\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # 1. OPTIMIZED DOWNLOAD (Bypass PHP using Lua)
    location = /garbage {
        default_type "application/octet-stream";
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Content-Disposition "attachment; filename=random.dat" always;
        add_header Content-Transfer-Encoding "binary" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Cache-Control, Content-Encoding" always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
        content_by_lua_block {
            -- Generate 1MB of incompressible pseudo-random bytes once per worker
            if not _G.shared_random_chunk then
                local t = {}
                math.randomseed(os.time())
                for i = 1, 131072 do -- 128KB seed
                    t[i] = string.char(math.random(0, 255))
                end
                local seed = table.concat(t)
                _G.shared_random_chunk = string.rep(seed, 8) -- 1MB chunk
            end
            
            local ckSize = tonumber(ngx.var.arg_ckSize) or 4
            -- Limit max chunk size to avoid overloading client/server memory
            if ckSize > 1024 then ckSize = 1024 end
            
            for i = 1, ckSize do
                ngx.print(_G.shared_random_chunk)
                ngx.flush(true)
            end
        }
    }

    # 2. OPTIMIZED UPLOAD (Bypass PHP using Lua)
    location = /empty {
        default_type "text/plain";
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Cache-Control, Content-Encoding" always;
        
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        
        content_by_lua_block {
            -- Read the incoming upload body and discard it instantly from memory
            ngx.req.read_body()
            ngx.say("")
        }
    }

    # 3. ROUTE TO PHP MVC ROUTER
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 4. PROCESS PHP VIA PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
        
        # Disable buffering to prevent FastCGI buffer overflow during high load
        fastcgi_buffering off;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With, Cache-Control, Content-Encoding" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }
}
