; speedtest_worker.js defaults xhr_ul_blob_megabytes to 20.
; PHP's stock post_max_size = 8M rejects those upload chunks before
; the /empty endpoint can send its headers. 32M leaves modest headroom.

post_max_size = 32M
upload_max_filesize = 32M

; Disable output buffering for streaming download chunks
output_buffering = Off
zlib.output_compression = Off
